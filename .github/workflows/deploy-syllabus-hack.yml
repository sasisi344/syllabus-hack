name: Deploy Syllabus Hack

on:
  push:
    branches:
      - main
    # サイトの表示に関わるファイルが変わったときだけ deploy する（2026-11-09。.workspace/・.task-management/・規約だけのコミットでは走らない）
    # ビルドが新しいフォルダを読むようになったら、ここに足す。公開を見送るコミットはメッセージに [skip ci] を付ける
    paths:
      - "src/**"
      - "public/**"
      - "astro.config.*"
      - "package.json"
      - "package-lock.json"
      - "pnpm-lock.yaml"
      - "tsconfig.json"
      - ".github/workflows/**"
      - "vendor/**"
      - "tailwind.config.js"
      - ".npmrc"
  workflow_dispatch: # 手動で実行できるボタンも残す

# 同じサイトの deploy を重ねない（実行中は止めず、待ちは最新の1件だけ残す）
concurrency:
  group: deploy-syllabus-hack
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 🛡️ Fix Dubious Ownership
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 💾 Setup Astro Build Cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules/.astro
            node_modules/.cache
          key: ${{ runner.os }}-astro-build-syllabus-${{ hashFiles('package-lock.json') }}-${{ github.run_number }}
          restore-keys: |
            ${{ runner.os }}-astro-build-syllabus-${{ hashFiles('package-lock.json') }}-
            ${{ runner.os }}-astro-build-syllabus-

      - name: 🔨 Build Astro Project
        run: npm run build

      - name: 🚀 Deploy via FTP (Diff only)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.SYLLABUS_FTP_SERVER || secrets.FTP_SERVER }}
          username: ${{ secrets.SYLLABUS_FTP_USERNAME || secrets.FTP_USERNAME }}
          password: ${{ secrets.SYLLABUS_FTP_PASSWORD || secrets.FTP_PASSWORD }}
          local-dir: dist/
          server-dir: /syllabushack.com/public_html/
          state-name: .ftp-deploy-sync-state-syllabus.json
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
