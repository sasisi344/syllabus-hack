[build]
  publish = "dist"
  command = "pnpm run build"
[build.processing.html]
  pretty_urls = false
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/sitemap*.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=3600"

# theory カテゴリ移行・スラッグ重複解消（2026-06-18）
[[redirects]]
  from = "/term/*"
  to = "/theory/:splat"
  status = 301

[[redirects]]
  from = "/trend/prompt-engineering-basics"
  to = "/theory/prompt-engineering-basics"
  status = 301

[[redirects]]
  from = "/trend/prompt-engineering-basics/"
  to = "/theory/prompt-engineering-basics/"
  status = 301
