# 注意: 本番ホスティングは Xserver（dist を静的アップロードのみ）であり、本ファイルは本番では機能しない。
# リダイレクトは astro.config.ts の redirects（静的meta-refreshページ生成）が正本（2026-07-12 整理、w28-site-verifi T3）。
[build]
  publish = "dist"
  command = "pnpm run build"
[build.processing.html]
  pretty_urls = false
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/sitemap*.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=3600"
